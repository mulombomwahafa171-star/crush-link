
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question ❤️</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #ffe0ec, #ffc1d9);
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
    }

    .container {
        background: white;
        padding: 35px 20px;
        width: 85%;
        max-width: 420px;
        border-radius: 25px;
        box-shadow: 0 10px 30px #d8799c55;
    }

    h1 {
        color: #ff3385;
        font-size: 27px;
    }

    p {
        color: #777;
    }

    button {
        padding: 14px 25px;
        border: none;
        border-radius: 25px;
        font-size: 17px;
        margin: 10px;
        cursor: pointer;
    }

    #yes {
        background: #ff3385;
        color: white;
    }

    #no {
        background: #777;
        color: white;
    }

    #progress {
        color: #ff3385;
        font-size: 13px;
        margin-top: 20px;
    }

    .heart {
        font-size: 45px;
    }
</style>
</head>

<body>

<div class="container" id="container">
    <div class="heart">❤️</div>

    <h1 id="question"></h1>

    <p id="subtitle">Be honest with me! 🥺</p>

    <button id="yes" onclick="nextQuestion()">
        YES ❤️
    </button>

    <button id="no">
        NO 💔
    </button>

    <div id="progress"></div>
</div>

<script>

const questions = [
    "Do you like me? ❤️",
    "Do you think I'm handsome? 😎",
    "Would you like to chat with me every day? 💬",
    "Do you miss me when I'm not around? 🥺",
    "Would you go on a date with me? 🌹",
    "Can I be someone special in your life? ❤️"
];

let currentQuestion = 0;

const question = document.getElementById("question");
const subtitle = document.getElementById("subtitle");
const progress = document.getElementById("progress");
const no = document.getElementById("no");

function showQuestion() {
    question.innerText = questions[currentQuestion];
    progress.innerText =
        "Question " + (currentQuestion + 1) +
        " of " + questions.length;
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        document.getElementById("container").innerHTML = `
            <div class="heart">🥰💖</div>
            <h1>YOU JUST MADE MY DAY!</h1>
            <h2 style="color:#ff3385">
                Thank you so much! ❤️
            </h2>
            <p>
                You have no idea how happy you made me!
            </p>
            <h1>😘🌹💕</h1>
            <p>With love ❤️</p>
        `;
    }
}

function runAway() {
    no.style.position = "fixed";

    const maxX = window.innerWidth - no.offsetWidth - 10;
    const maxY = window.innerHeight - no.offsetHeight - 10;

    no.style.left = Math.max(5, Math.random() * maxX) + "px";
    no.style.top = Math.max(5, Math.random() * maxY) + "px";
}

no.addEventListener("pointerenter", function(e) {
    if (e.pointerType === "mouse") runAway();
});

no.addEventListener("touchstart", function(e) {
    e.preventDefault();
    runAway();
}, {passive: false});

no.addEventListener("click", function(e) {
    e.preventDefault();
    runAway();
});

showQuestion();

</script>

</body>
    </html>
